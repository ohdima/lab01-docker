apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-ac-576-220239-v13
  namespace: state-ac-576-220239-v13
  labels:
    app: postgres
    org.bstu.owner: ohdima
    org.bstu.group: ac-576
    org.bstu.student.id: "220239"
    org.bstu.variant: "13"
    org.bstu.course: rsiot
spec:
  serviceName: db-ac-576-220239-v13
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres

          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi